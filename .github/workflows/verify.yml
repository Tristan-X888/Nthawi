name: Verify repository

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Step 3 gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_API_URL: https://app.example.test

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.16.1"
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(pnpm --version)" = "10.16.1"

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile remained unchanged
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Check repository and package boundaries
        run: pnpm check:step3

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Build compiled API image
        run: |
          docker build \
            --pull \
            --file infra/docker/api.Dockerfile \
            --tag nthawi-api:ci \
            .

      - name: Verify API image
        run: pnpm check:api-image nthawi-api:ci
