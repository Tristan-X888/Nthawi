# Staging widget project only. The current Vite page is not a product journey.
# Provider build_settings.stop_builds=true and no build hooks are required.
[build]
  base = "."
  command = "pnpm install --frozen-lockfile && pnpm --filter @nthawi/widget build"
  publish = "apps/widget/dist"
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "24.21.0"
  PNPM_VERSION = "10.16.1"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://api-staging.nthawi.io; frame-ancestors *; base-uri 'none'; form-action 'none'; object-src 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
